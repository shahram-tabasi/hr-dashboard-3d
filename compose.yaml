services:
  dashboard:
    build:
      context: .
      args:
        NODE_IMAGE: "${NODE_IMAGE:-registry.simorghai.com/docker-proxy/library/node:24-bookworm-slim}"
    ports:
      - "${DASHBOARD_PORT:-3000}:3000"
    restart: unless-stopped
    volumes:
      - hr-dashboard-data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 15s
      retries: 3

volumes:
  hr-dashboard-data:
